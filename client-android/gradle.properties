# AidotVpn Android — Gradle properties.

# JVM args for the Gradle daemon. 4G is generous; the WireGuard tunnel
# JNI build pulls in a fair amount of native objects.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Parallel + caching speed up multi-module builds substantially.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is the standard now; opt-out is unsupported.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin code style — matches what Android Studio's auto-format produces.
kotlin.code.style=official

# Suppress the "buildFeatures.compose=true required" warning when we set
# it from our convention plugin.
android.defaults.buildfeatures.shaders=false

# The controller the demo app talks to.
#
# Empty means the emulator default (10.0.2.2, which is the emulator's
# alias for the host machine). A real handset needs the LAN address of
# the machine running `npm start` — find it with `ipconfig` on Windows.
#
# Not localhost: on a phone that means the phone.
#
# The value is printed during the build:
#
#   aidot: demo-app CONTROLLER_URL = http://172.30.1.67:10030
#
# and shown in the app above the 등록 요청 button, so a mismatch between
# what you set and what the app uses is visible in two places.
# aidot.controllerUrl=http://192.168.0.15:10030
