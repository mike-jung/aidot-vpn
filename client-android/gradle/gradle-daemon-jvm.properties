# The JVM that runs Gradle itself.
#
# Distinct from `kotlin { jvmToolchain(17) }` in the module build files,
# and the distinction is the whole point of this file:
#
#   jvmToolchain(17)   the JDK that COMPILES the source
#   this file          the JDK that RUNS Gradle
#
# 0.29.0 pinned the first and claimed the build no longer depended on an
# IDE setting. It still did. Android Studio picks the "Gradle JVM"
# separately, and a recent Studio selects JDK 25 — which Gradle 8.14.3
# refuses, because it supports 1.8 through 24:
#
#   The project's Gradle version 8.14.3 is incompatible with the Gradle
#   JVM version 25 currently selected to run Gradle build.
#
# Declaring the criterion here makes Gradle start its daemon on a JDK 17
# regardless of what launched it, so the repository decides rather than
# whichever IDE build the developer happens to have.
#
# Gradle 8.8+ reads this file; 8.13+ can download a matching JDK when
# none is installed, which is what the foojay plugin in settings.gradle.kts
# enables.
#
# Regenerate with:  ./gradlew updateDaemonJvm --jvm-version=17
toolchainVersion=17
