name: Public validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Keep every operating system reporting its own result. With the default
      # fail-fast, one job's failure cancels the others mid-install, and the
      # cancelled job reports an unrelated SIGINT plus Windows EPERM cleanup
      # warnings instead of the failure that actually happened.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the Public snapshot
        uses: actions/checkout@v4
      - name: Set up Node from .node-version
        uses: actions/setup-node@v4
        with:
          # The same file the build and packaging scripts read, so CI and the
          # installer never disagree about the runtime.
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Matches the toolchain directive in server/go.mod.
          go-version: '1.27.1'
          cache-dependency-path: server/go.sum
      - name: Report the resolved toolchain
        run: |
          node --version
          npm --version
          go version
      - name: Install console dependencies
        run: npm --prefix console ci
        timeout-minutes: 10
      - name: HTTPS certificate tests
        run: node --test scripts/tests/https-cert.test.mjs
        timeout-minutes: 10
      - name: Console login tests
        run: npm run test:login
        timeout-minutes: 10
      - name: Server tests
        run: go test ./...
        working-directory: server
        timeout-minutes: 15
      - name: nftables ruleset syntax, checked by the real parser
        # `nft -c` never commits, but even a check-only run needs CAP_NET_ADMIN
        # to read the kernel's nf_tables cache, and the job runs as an
        # unprivileged user. The step above therefore skips
        # TestRenderedRulesetParsesWithNft. Here the same test runs as root, so
        # every push still validates the generated ruleset against nft itself,
        # and AIDOTVPN_TEST_REQUIRE_NFT turns a skip into a failure should the
        # runner ever lose nft or the privilege.
        if: runner.os == 'Linux'
        run: |
          command -v nft >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq nftables; }
          go test -c -o "$RUNNER_TEMP/gateway.test" ./internal/gateway
          sudo env AIDOTVPN_TEST_REQUIRE_NFT=1 "$RUNNER_TEMP/gateway.test" -test.run '^TestRenderedRulesetParsesWithNft$' -test.v
        working-directory: server
        timeout-minutes: 5
