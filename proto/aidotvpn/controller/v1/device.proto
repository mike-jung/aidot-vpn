// DeviceService — primary RPC surface for the AidotVpn mobile client.
//
// Authentication model:
//
//   * Register is called with an OIDC bearer token (no client cert yet).
//     The interceptor verifies the token and injects the resolved user.
//
//   * RotateKey, ListMyDevices, and Revoke are called over mTLS using
//     the short-lived client certificate the controller issued during
//     Register. The interceptor pulls the device id from the URI SAN
//     (urn:aidotvpn:device:<uuid>) and re-asserts the OIDC token has
//     not been revoked.
//
// Idempotency:
//
//   * Register is idempotent on (user, install_id). A repeated call from
//     the same install (e.g. after re-install) returns the existing
//     device record and re-issues the cert+key. Callers should NOT rely
//     on Register creating a *new* device on repeat calls.
//
//   * RotateKey is naturally idempotent through the new public key:
//     calling twice with the same new pubkey is a no-op on the second.
syntax = "proto3";

package aidotvpn.controller.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "aidotvpn/controller/v1/types.proto";

service DeviceService {
  // Register a new device for the authenticated user.
  rpc Register(RegisterRequest) returns (RegisterResponse) {}

  // Rotate the device's WireGuard keypair. Allocated VPN addresses are
  // preserved; only the public key + paired PSK change.
  rpc RotateKey(RotateKeyRequest) returns (RotateKeyResponse) {}

  // List devices owned by the authenticated user. Used by the mobile UI
  // for the "your devices" screen.
  rpc ListMyDevices(ListMyDevicesRequest) returns (ListMyDevicesResponse) {}

  // Revoke a device. The user can self-revoke; admins (via console) can
  // revoke any device in their tenant.
  rpc Revoke(RevokeRequest) returns (RevokeResponse) {}
}

message Device {
  string id              = 1 [(buf.validate.field).string.uuid = true];
  string display_name    = 2 [(buf.validate.field).string.min_len = 1,
                              (buf.validate.field).string.max_len = 128];
  Platform platform      = 3;
  DeviceStatus status    = 4;
  string os_version      = 5 [(buf.validate.field).string.max_len = 64];
  string app_version     = 6 [(buf.validate.field).string.max_len = 64];
  google.protobuf.Timestamp created_at  = 7;
  google.protobuf.Timestamp last_seen_at = 8;
}

// Allocation describes the VPN address(es) and crypto material assigned
// to a device key.
message Allocation {
  // base64-encoded WireGuard public key the SERVER expects this device
  // to use. When the client sent its own pubkey in the request, this
  // echoes back what was registered (so the client can sanity-check).
  string device_public_key = 1 [(buf.validate.field).string.len = 44];

  // base64-encoded PSK paired with the keypair. Treat as secret.
  string psk = 2 [(buf.validate.field).string.len = 44];

  PSKSource psk_source = 3;

  // Allocated VPN addresses inside the tenant's pool.
  string ipv4_addr = 4;  // dotted decimal, "" if v4 disabled
  string ipv6_addr = 5;  // RFC 5952, "" if v6 disabled

  // Short-lived client certificate (PEM) for mTLS to the controller.
  string client_cert_pem = 6;
  google.protobuf.Timestamp client_cert_expires_at = 7;

  // CA cert chain (PEM) the client should pin when calling the controller.
  string ca_cert_pem = 8;
}

message RegisterRequest {
  // Stable per-install UUID generated by the client. Survives app updates;
  // rotates on app uninstall.
  string install_id = 1 [(buf.validate.field).string.uuid = true];

  // Friendly device name shown in the admin console. e.g. "Alice's Pixel 9".
  string display_name = 2 [(buf.validate.field).string.min_len = 1,
                           (buf.validate.field).string.max_len = 128];

  Platform platform = 3 [(buf.validate.field).enum.defined_only = true];

  string os_version  = 4 [(buf.validate.field).string.max_len = 64];
  string app_version = 5 [(buf.validate.field).string.max_len = 64];

  // base64-encoded Curve25519 public key the device generated locally
  // (ideally inside Android Keystore / iOS Secure Enclave so the matching
  // private key never leaves hardware).
  string device_public_key = 6 [(buf.validate.field).string.len = 44];

  // Optional: Play Integrity / App Attest token to be verified server-side.
  // If absent or fails, the device lands in status PENDING_ATTEST and
  // cannot reach data nodes until cleared by an admin or by a subsequent
  // attestation submission.
  string attestation_token = 7;

  // PEM-encoded PKCS#10 Certificate Signing Request for the device's
  // mTLS client cert. The device generated the matching private key in
  // hardware (Android Keystore / iOS Secure Enclave) and the controller
  // signs only the public key inside this CSR. If empty, the controller
  // falls back to the legacy server-side key generation (Phase 5a path).
  // Phase 5b deployments should always send this.
  string client_cert_csr_pem = 8;
}

message RegisterResponse {
  Device device         = 1;
  Allocation allocation = 2;

  // Catalogue of nodes the device can connect to, with their endpoints.
  // Filtered by tenant + policy.
  repeated Node nodes = 3;
}

message RotateKeyRequest {
  // base64-encoded new public key.
  string new_device_public_key = 1 [(buf.validate.field).string.len = 44];
  // Optional fresh attestation; treated like Register's field.
  string attestation_token = 2;
  // Fresh CSR for the new mTLS cert. Required from Phase 5b clients.
  // The controller verifies the CSR signature (proving the device
  // possesses the matching private key) before issuing.
  string client_cert_csr_pem = 3;
}

message RotateKeyResponse {
  Allocation allocation = 1;
}

message ListMyDevicesRequest {}

message ListMyDevicesResponse {
  repeated Device devices = 1;
}

message RevokeRequest {
  string device_id = 1 [(buf.validate.field).string.uuid = true];
  string reason    = 2 [(buf.validate.field).string.max_len = 256];
}

message RevokeResponse {}
