# AidotVpn dev data-plane WG node — wg0.conf
#
# The PrivateKey here is derived deterministically from the seed
# "aidotvpn-dev-node-1-2026" (SHA-256 → X25519 clamping). The
# corresponding public key is what migration 0005 stamps into the
# `nodes` table — that's how the Android client knows which key to
# encrypt its initiation message to.
#
# NEVER use this PrivateKey in any environment that handles real user
# traffic. It's published in our repo. Production data nodes generate
# their own keypair on first boot and register the public key with the
# controller via NodeService.
#
# The Address (10.78.0.1/16) is the gateway address inside the dev
# tenant's IPv4 pool (10.78.0.0/16, configured in tenants_default).
# The peer list is empty here — the reconcile-peers.sh sidecar adds
# device peers dynamically as they register against the controller.

[Interface]
# base64( hex(38dd7c46c01ff91a31f2de65568def760ea619409ac702fb789ddcb0b6037e40) )
PrivateKey = ON18RsAf+Roxjy3WVo3vdg6mGUCacC+3id3csLYDfkA=
Address = 10.78.0.1/16
ListenPort = 52840

# Allow forwarding so packets from peers can reach the host's other
# docker networks (controller, etc.) — useful for split-tunnel demos
# pointing at internal services.
# NO blanket FORWARD ACCEPT here (removed in 0.10.0).
#
# This line used to read:
#   PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -A FORWARD -o %i -j ACCEPT
#
# which forwarded every packet arriving on the tunnel to anything the
# gateway could route to. Destination restriction existed only as the
# AllowedIPs list in each client's own config — a routing hint the client
# controls, not an access control. A rooted phone setting AllowedIPs to
# 0.0.0.0/0 reached the entire hospital network.
#
# Enforcement now lives in the nftables table `inet aidotvpn`, rendered
# from controller policy by cmd/gateway-agent. That table's forward chain
# defaults to drop. Re-adding an ACCEPT rule here would sit in the older
# iptables path and silently defeat it, so: do not.
#
# Forwarding itself is still enabled via net.ipv4.ip_forward in
# docker-compose.yml; the agent decides what is permitted to traverse.

# Peer entries are appended at runtime by /config/wg_confs/peers.d/*.conf
# files written by the reconcile sidecar. The linuxserver/wireguard
# image's `wg-quick up` reads them in alphabetical order.
