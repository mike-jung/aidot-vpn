<svg xmlns="http://www.w3.org/2000/svg" viewBox="-78 -78 412 412" width="256" height="256">
  <!--
    AidotVpn mark: a gatekeeper's shield with a tunnel passing through it.

    The shield is the gateway — the one door. The horizontal band is the
    tunnel: it enters from the outside (left, dashed = encrypted
    envelopes) and exits into the hospital (right, solid = plain LAN).
    The gap in the shield's outline where the band crosses is the point
    the whole product is about: traffic passes only where the gate lets
    it. Cyan on navy matches the app's dark palette and the console's
    accent family.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#22D3EE"/>
      <stop offset="0.75" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

    
  <!-- Shield outline, with a gap on each side where the tunnel crosses. -->
  <path d="M128 44
           C 156 60, 180 62, 196 60
           L 196 108"
        fill="none" stroke="#22D3EE" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M196 150
           C 196 190, 160 212, 128 226
           C 96 212, 60 190, 60 150"
        fill="none" stroke="#22D3EE" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 108
           L 60 60
           C 76 62, 100 60, 128 44"
        fill="none" stroke="#22D3EE" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The tunnel: dashed outside, solid inside, one band through the gate. -->
  <line x1="18" y1="129" x2="112" y2="129" stroke="#22D3EE" stroke-width="14" stroke-linecap="round" stroke-dasharray="4 18"/>
  <rect x="106" y="120" width="132" height="18" rx="9" fill="url(#beam)"/>

  <!-- Keyhole at the crossing: the gate checks every packet. -->
  <circle cx="128" cy="129" r="16" fill="#0B1120" stroke="#22D3EE" stroke-width="6"/>
  <circle cx="128" cy="129" r="5" fill="#22D3EE"/>
</svg>
